[package]
name = "ttid"
# Cargo requires semver and CalVer's zero-padded fields are not valid semver
# (`26.32.02` has a leading zero in the patch field), so the released version
# lives in the `VERSION` file, which `publish.yml` reads. This one is inert:
# the crate is `publish = false` and ships as a binary, not from crates.io.
version = "0.0.0-rewrite"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
repository = "https://github.com/d31ma/TTID"
description = "Time-tagged identifiers — compact IDs carrying their own created, updated, and deleted timestamps"
publish = false

# One source, two artifacts. `--bin ttid` builds the native transport;
# `--lib --target wasm32-unknown-unknown` builds the cdylib for wasm hosts.
[lib]
name = "ttid"
crate-type = ["rlib", "cdylib"]

# The `ttid` binary arrives in Phase 4; cargo picks up src/main.rs on sight.

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
# `preserve_order` is load-bearing: JSON.stringify emits keys in insertion
# order, and the machine protocol's response shape is contract.
serde_json = { version = "1.0.151", features = ["preserve_order"] }

[lints.rust]
unsafe_code = "deny" # not `forbid`: src/wasm.rs opts back in per-function
missing_docs = "deny"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
wasmi = { version = "1.1.0", default-features = false, features = ["std"] }
