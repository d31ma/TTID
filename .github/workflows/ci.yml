name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # The engine. Fast, and the gate most changes need.
  engine:
    name: Rust engine
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # rust-toolchain.toml pins the channel and the wasm32 target; rustup
      # installs both on first use.
      - name: Show toolchain
        run: rustup show

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy (native)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Clippy (wasm32)
        run: cargo clippy --lib --target wasm32-unknown-unknown -- -D warnings

      # oracle.rs replays the frozen corpus recorded from the JavaScript engine
      # this replaced; invariants.rs asserts the properties those cases sample;
      # machine.rs covers the protocol field by field. See docs/TEST_MIGRATION.md.
      - name: Kernel and protocol tests
        run: cargo test --test oracle --test invariants --test machine

      # deny.toml has been configured all along but nothing ran it, so
      # advisories and license drift went unchecked. This is that gate.
      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Advisories, bans, licenses, sources
        run: cargo deny check

  # The WebAssembly artifact: identical answers, small enough to ship, and
  # correct in a real browser.
  wasm:
    name: WebAssembly
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Installs the pinned channel *and* the wasm32 target declared in
      # rust-toolchain.toml. Building without this fails with "can't find crate
      # for `std`", because cargo alone does not add a missing target.
      - name: Show toolchain
        run: rustup show

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-wasm-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: Build the module
        run: cargo build --lib --release --target wasm32-unknown-unknown

      # ABI parity and the size budget run under wasmi; the browser test drives
      # the Chrome on the runner image, which is the only place the clamped
      # performance.now() that once cut a 2000-id burst to 135 is reproducible.
      - name: ABI parity, size budget, browser
        run: cargo test --test wasm --test browser -- --nocapture

  # The contract with everything that calls TTID. Slow: Kotlin and C# compile.
  surface:
    name: CLI and client shims
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Show toolchain
        run: rustup show

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-surface-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      # Argument grammar, help text, exit codes, and the NDJSON loop, against a
      # committed recording.
      - name: CLI surface
        run: cargo test --test cli -- --nocapture

      # The shims are the regression test: if one needs an edit to drive the
      # binary, compatibility broke. These toolchains ship on the runner image,
      # so a missing one is a real failure; dart, kotlin and swift run
      # opportunistically and are named in the skip list.
      - name: Client shims drive the binary unmodified
        env:
          TTID_REQUIRE: python,ruby,node,php,go,rust,java,csharp
        run: cargo test --test shims -- --nocapture

  # The installers are how most users get the binary, so their checksum gate is
  # release-critical and must keep failing closed.
  installers:
    # Named explicitly so the check context stays stable for branch protection;
    # a bare matrix job name would expand to include every matrix value.
    name: Installers (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            label: sh
            script: sh tests/install.sh
          - runner: windows-latest
            label: pwsh
            script: pwsh -NoProfile -File tests/install.ps1

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Test installer
        shell: bash
        run: ${{ matrix.script }}
